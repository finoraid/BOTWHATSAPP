services:
  - type: web
    name: whatsapp-ai-downloader
    runtime: docker
    plan: free
    dockerfilePath: ./downloader/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DOWNLOADER_SHARED_SECRET
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: GRAPH_API_VERSION
        value: v23.0
